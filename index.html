
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna Vikash Techno School - Futuristic LED Show</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    isolation: isolate;
    background:
        radial-gradient(ellipse at center,
        #092a40 0%,
        #041421 35%,
        #01060c 72%,
        #000 100%);
}

/* BACKGROUND LIGHT */

.background-glow {
    position: absolute;
    width: min(90vw, 110vh);
    aspect-ratio: 1;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(0, 155, 220, .19),
        rgba(0, 80, 150, .08) 45%,
        transparent 72%
    );
    filter: blur(35px);
    z-index: 1;
    animation: glow-pulse 7s ease-in-out infinite;
}

@keyframes glow-pulse {
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
}

/* STAR PARTICLES */

.stars {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #8cecff;
    box-shadow: 0 0 10px #28bfff;
    animation: twinkle var(--duration) ease-in-out infinite;
    animation-delay: var(--delay);
}

@keyframes twinkle {
    0%, 100% {
        opacity: .15;
        transform: scale(.6);
    }
    50% {
        opacity: 1;
        transform: scale(1.8);
    }
}

/* OUTER CIRCULAR TRACKS */

.track {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
}

.track-one {
    width: min(92vh, 86vw);
    aspect-ratio: 1;
    border: 1px solid rgba(37, 192, 237, .24);
    box-shadow:
        0 0 20px rgba(0, 150, 220, .12),
        inset 0 0 20px rgba(0, 150, 220, .05);
    z-index: 2;
}

.track-two {
    width: min(100vh, 94vw);
    aspect-ratio: 1;
    border: 1px dashed rgba(55, 157, 218, .22);
    animation: track-spin 90s linear infinite;
    z-index: 2;
}

.track-three {
    width: min(77vh, 72vw);
    aspect-ratio: 1;
    border: 1px solid rgba(54, 195, 232, .12);
    box-shadow: 0 0 25px rgba(0, 170, 220, .08);
    z-index: 2;
}

@keyframes track-spin {
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

/* MOVING ENERGY LIGHT ON OUTER RING */

.energy-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(92vh, 86vw);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 265deg,
        rgba(0, 190, 255, .05) 290deg,
        #28d9ff 310deg,
        #ffffff 315deg,
        transparent 325deg,
        transparent 360deg
    );

    -webkit-mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 2px),
        #000 calc(100% - 1px)
    );

    mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 2px),
        #000 calc(100% - 1px)
    );

    animation: energy-spin 12s linear infinite;
    z-index: 2;
    pointer-events: none;
}

@keyframes energy-spin {
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

/* ACTIVITY PHOTO ORBIT */

.orbit {
    --orbit-size: min(86vh, 78vw);
    --orbit-radius: calc(var(--orbit-size) / 2);

    position: absolute;
    z-index: 4;
    left: 50%;
    top: 50%;
    width: var(--orbit-size);
    height: var(--orbit-size);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    animation: orbit-spin 38s linear infinite;
}

/* PHOTO POSITIONS */

.orbit-item {
    --angle: 0deg;

    position: absolute;
    left: 50%;
    top: 50%;

    width: clamp(115px, 12vw, 195px);
    aspect-ratio: 1;

    transform:
        translate(-50%, -50%)
        rotate(var(--angle))
        translateY(calc(-1 * var(--orbit-radius)));
}

/* PHOTO HALO */

.photo-halo {
    position: absolute;
    inset: -9px;
    border-radius: 50%;
    border: 1px solid rgba(51, 206, 255, .45);
    box-shadow:
        0 0 15px rgba(0, 175, 240, .3),
        inset 0 0 12px rgba(0, 175, 240, .2);
    animation: halo-pulse 3s ease-in-out infinite alternate;
}

@keyframes halo-pulse {
    from {
        opacity: .45;
        transform: scale(.96);
    }
    to {
        opacity: 1;
        transform: scale(1.05);
    }
}

/* ACTIVITY IMAGES */

.activity-photo {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center;

    border: 4px solid #42cafa;

    box-shadow:
        0 0 10px #00a9e9,
        0 0 25px rgba(0, 170, 240, .55),
        0 0 45px rgba(0, 100, 220, .22);

    animation: photo-counter-spin 38s linear infinite;
}

/* SIX PHOTO POSITIONS */

.orbit-item:nth-child(1) { --angle: 0deg; }
.orbit-item:nth-child(2) { --angle: 60deg; }
.orbit-item:nth-child(3) { --angle: 120deg; }
.orbit-item:nth-child(4) { --angle: 180deg; }
.orbit-item:nth-child(5) { --angle: 240deg; }
.orbit-item:nth-child(6) { --angle: 300deg; }

@keyframes orbit-spin {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

@keyframes photo-counter-spin {
    from { rotate: 0deg; }
    to { rotate: -360deg; }
}

/* SMALL ORBITING LIGHT DOTS */

.orbit-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #a7f2ff;
    box-shadow:
        0 0 10px #00bfff,
        0 0 25px #00aaff;
}

.dot-one {
    transform: translate(-50%, -50%) translateY(-46vh);
}

.dot-two {
    transform: translate(-50%, -50%) translateY(46vh);
}

.dot-three {
    transform: translate(-50%, -50%) translateX(-46vh);
}

.dot-four {
    transform: translate(-50%, -50%) translateX(46vh);
}

/* CENTRAL LOGO */

.logo-wrap {
    position: absolute;
    z-index: 8;
    left: 50%;
    top: 50%;

    width: min(32vw, 48vh);
    aspect-ratio: 2048 / 1677;

    transform: translate(-50%, -50%);
}

/* SOFT GLOW BEHIND LOGO */

.logo-aura {
    position: absolute;
    width: 125%;
    height: 125%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(0, 160, 230, .13),
        transparent 70%
    );
    filter: blur(15px);
    z-index: -1;
}

.logo-text {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(0, 160, 220, .18));
}

/* FIXED BLUE LANDMARK */

.logo-mark {
    position: absolute;
    left: 49.3%;
    top: -0.5%;
    width: 39.2%;
    height: 41.2%;
    object-fit: contain;
    transform: rotate(0deg);
    animation: none;
    filter: drop-shadow(0 0 12px rgba(61, 190, 220, .35));
}

/* RESPONSIVE LED DISPLAY */

@media (max-aspect-ratio: 4/3) {

    .logo-wrap {
        width: min(43vw, 39vh);
    }

    .orbit {
        --orbit-size: min(78vh, 84vw);
    }

    .orbit-item {
        width: clamp(90px, 15vw, 150px);
    }

    .track-one {
        width: min(88vh, 91vw);
    }

    .track-two {
        width: min(95vh, 96vw);
    }

    .track-three {
        width: min(70vh, 75vw);
    }

    .energy-ring {
        width: min(88vh, 91vw);
    }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
    .orbit,
    .track-two,
    .energy-ring,
    .activity-photo,
    .photo-halo,
    .star,
    .background-glow {
        animation-duration: 90s;
    }
}
</style>
</head>

<body>

<main class="stage">

    <div class="background-glow"></div>

    <!-- STAR PARTICLES -->
    <div class="stars">
        <span class="star" style="left:8%;top:18%;--duration:3s;--delay:0s"></span>
        <span class="star" style="left:18%;top:72%;--duration:4s;--delay:1s"></span>
        <span class="star" style="left:30%;top:12%;--duration:3.5s;--delay:2s"></span>
        <span class="star" style="left:78%;top:15%;--duration:4s;--delay:.5s"></span>
        <span class="star" style="left:90%;top:38%;--duration:3s;--delay:1.5s"></span>
        <span class="star" style="left:85%;top:82%;--duration:5s;--delay:2s"></span>
        <span class="star" style="left:12%;top:48%;--duration:4s;--delay:.8s"></span>
        <span class="star" style="left:68%;top:88%;--duration:3s;--delay:1s"></span>
        <span class="star" style="left:46%;top:8%;--duration:5s;--delay:2s"></span>
        <span class="star" style="left:55%;top:93%;--duration:4s;--delay:.5s"></span>
        <span class="star" style="left:95%;top:65%;--duration:3s;--delay:1s"></span>
        <span class="star" style="left:5%;top:88%;--duration:4s;--delay:2s"></span>
    </div>

    <!-- FUTURISTIC RINGS -->
    <div class="track track-one"></div>
    <div class="track track-two"></div>
    <div class="track track-three"></div>
    <div class="energy-ring"></div>

    <!-- ORBITING LIGHTS -->
    <div class="orbit-dot dot-one"></div>
    <div class="orbit-dot dot-two"></div>
    <div class="orbit-dot dot-three"></div>
    <div class="orbit-dot dot-four"></div>

    <!-- SIX CIRCULAR ACTIVITY PHOTOS -->
    <div class="orbit">

        <div class="orbit-item">
            <div class="photo-halo"></div>
            <img class="activity-photo" src="activity-1.jpg" alt="Activity 1">
        </div>

        <div class="orbit-item">
            <div class="photo-halo"></div>
            <img class="activity-photo" src="activity-1.jpg" alt="Activity 2">
        </div>

        <div class="orbit-item">
            <div class="photo-halo"></div>
            <img class="activity-photo" src="activity-1.jpg" alt="Activity 3">
        </div>

        <div class="orbit-item">
            <div class="photo-halo"></div>
            <img class="activity-photo" src="activity-1.jpg" alt="Activity 4">
        </div>

        <div class="orbit-item">
            <div class="photo-halo"></div>
            <img class="activity-photo" src="activity-1.jpg" alt="Activity 5">
        </div>

        <div class="orbit-item">
            <div class="photo-halo"></div>
            <img class="activity-photo" src="activity-1.jpg" alt="Activity 6">
        </div>

    </div>

    <!-- FIXED CENTRAL SCHOOL LOGO -->
    <div class="logo-wrap">

        <div class="logo-aura"></div>

        <img
            class="logo-text"
            src="school-logo-text.png"
            alt="Krishna Vikash Techno School"
        >

        <img
            class="logo-mark"
            src="school-logo-mark.png"
            alt=""
        >

    </div>

</main>

</body>
</html>
